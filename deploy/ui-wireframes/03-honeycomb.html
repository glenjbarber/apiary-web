<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apiary - 03 Honeycomb</title>
<link rel="stylesheet" href="wf-base.css">
<style>
  :root { --bg: #262c37; --bg-2: #2d3440; }
  .top { display: flex; align-items: center; gap: 22px; padding: 14px 28px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .14em; font-size: 13px; margin-right: 10px; }
  .brand b { width: 14px; height: 14px; background: var(--accent); clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
  .top nav a { color: var(--muted); font-size: 13.5px; margin-right: 18px; }
  .top nav a.active { color: var(--ink); }
  .top nav a:hover { color: var(--ink); }
  .top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .find { width: 240px; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--faint); font-size: 13px; }

  .wrap { display: grid; grid-template-columns: 1fr 340px; gap: 0; border-top: 1px solid var(--line-soft); min-height: calc(100vh - 59px); }
  .stage { padding: 22px 28px; position: relative; }
  .summary { display: flex; gap: 26px; align-items: baseline; flex-wrap: wrap; }
  .summary h1 { margin: 0; font-size: 18px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .summary span { color: var(--muted); font-size: 13px; }
  .summary b { color: var(--ink); font-weight: 600; }
  svg { display: block; width: 100%; max-width: 860px; height: auto; margin: 10px auto 0; }
  .hx { cursor: pointer; transition: opacity .15s; }
  .hx:hover { opacity: .8; }
  .lbl { fill: var(--ink); font: 600 14px var(--sans); }
  .lbl2 { fill: var(--faint); font: 12px var(--sans); }
  .legend { display: flex; gap: 18px; justify-content: center; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
  .tip { position: absolute; pointer-events: none; background: #1b2028; border: 1px solid var(--line); padding: 6px 9px; border-radius: 5px; font-size: 12px; display: none; white-space: nowrap; }

  .panel { border-left: 1px solid var(--line-soft); background: #2a303b; padding: 22px; display: flex; flex-direction: column; gap: 20px; }
  .panel h2 { margin: 0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .panel .kv { display: grid; grid-template-columns: 90px 1fr; gap: 7px 10px; font-size: 13px; }
  .panel .kv dt { color: var(--faint); }
  .panel .kv dd { margin: 0; }
  .panel h3 { margin: 0 0 8px; font-size: 12px; color: var(--faint); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  .panel .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .panel .cl div { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .panel .cl div small { margin-left: auto; color: var(--faint); }
  .note { font-size: 12.5px; color: var(--warn); }
  .colony { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line-soft); font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; }
  .colony div { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><b></b>APIARY</div>
  <nav><a class="active" href="#">Colony</a><a href="#">Cells</a><a href="#">Network</a><a href="#">Storage</a><a href="#">Images</a><a href="#">Admin</a></nav>
  <div class="right"><div class="find">Find anything <kbd>/</kbd></div><a class="btn primary" href="#">Create cell</a></div>
</div>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="summary">
      <h1><i class="dot ok"></i>skyview is healthy</h1>
      <span><b>4</b>/4 combs</span>
      <span><b>21</b>/23 cells running</span>
      <span>leader <b>brood</b></span>
      <span style="color:var(--warn)">3 warnings</span>
    </div>
    <svg id="map" viewBox="0 0 860 520" aria-label="Colony map: combs and their cells"></svg>
    <div class="legend">
      <span><i style="background:var(--ok);opacity:.6"></i>Running</span>
      <span><i style="background:var(--warn)"></i>Needs attention</span>
      <span><i style="background:var(--line)"></i>Stopped</span>
      <span><i style="background:var(--accent)"></i>Comb</span>
    </div>
    <div class="tip" id="tip"></div>
  </div>

  <aside class="panel" id="panel"></aside>
</div>

<nav class="wf-pill"><a href="index.html">All</a><a data-dir="prev" href="02-palette.html">&larr;</a><span>3 / 7 Honeycomb</span><a data-dir="next" href="04-inbox.html">&rarr;</a></nav>
<script src="wf-nav.js"></script>
<script>
var combs = [
  { name: 'brood', role: 'Leader', state: 'ok', cpu: 34, mem: 58, zfs: 52, up: '41d', at: [215, 140],
    cells: [['web-01','vm','run'],['web-02','vm','run'],['db-01','vm','warn','Replica on propolis is 4m behind'],['dns','jail','run'],['proxy','jail','run'],['git','jail','run'],['monitor','jail','run']] },
  { name: 'apiarium', role: 'Follower', state: 'ok', cpu: 22, mem: 47, zfs: 61, up: '41d', at: [645, 140],
    cells: [['ci-runner-01','vm','run'],['ci-runner-02','vm','run'],['pkg-builder','jail','run'],['mail','jail','run'],['ldap','jail','run'],['backup','jail','run']] },
  { name: 'nectar', role: 'Follower', state: 'warn', cpu: 61, mem: 86, zfs: 70, up: '12d', at: [215, 375], note: 'Memory at 86%. Consider moving a cell to propolis.',
    cells: [['win-test','vm','run'],['freebsd-head','vm','run'],['linux-ci','vm','run'],['build-old','vm','off'],['wiki','jail','run'],['chat','jail','run']] },
  { name: 'propolis', role: 'Follower', state: 'ok', cpu: 18, mem: 39, zfs: 58, up: '3d', at: [645, 375],
    cells: [['grafana','jail','run'],['s3','jail','run'],['staging-web','vm','run'],['sandbox','vm','off']] }
];
var R = 27, S3 = Math.sqrt(3), NS = 'http://www.w3.org/2000/svg';
var dirs = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function ring(k) {
  var out = [], q = dirs[4][0]*k, r = dirs[4][1]*k;
  for (var i = 0; i < 6; i++) for (var j = 0; j < k; j++) { out.push([q, r]); q += dirs[i][0]; r += dirs[i][1]; }
  return out;
}
var slots = ring(1).concat(ring(2));
function hexPts(cx, cy, r) {
  var p = [];
  for (var i = 0; i < 6; i++) { var a = Math.PI / 180 * (60 * i - 90); p.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1)); }
  return p.join(' ');
}
function el(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
var css = getComputedStyle(document.documentElement);
var C = { ok: css.getPropertyValue('--ok').trim(), warn: css.getPropertyValue('--warn').trim(), line: css.getPropertyValue('--line').trim(), accent: css.getPropertyValue('--accent').trim(), bg2: css.getPropertyValue('--bg-2').trim() };
var map = document.getElementById('map'), tip = document.getElementById('tip'), stage = document.getElementById('stage');

combs.forEach(function (c, ci) {
  var g = el('g', {});
  var center = el('polygon', { points: hexPts(c.at[0], c.at[1], R - 2), fill: C.bg2, stroke: c.state === 'warn' ? C.warn : C.accent, 'stroke-width': 2.5, class: 'hx' });
  center.addEventListener('click', function () { show(ci); });
  g.appendChild(center);
  var core = el('polygon', { points: hexPts(c.at[0], c.at[1], 9), fill: c.state === 'warn' ? C.warn : C.accent });
  core.style.pointerEvents = 'none';
  g.appendChild(core);
  c.cells.forEach(function (cell, i) {
    var s = slots[i], x = c.at[0] + R * S3 * (s[0] + s[1] / 2), y = c.at[1] + R * 1.5 * s[1];
    var st = cell[2];
    var h = el('polygon', {
      points: hexPts(x, y, R - 3),
      fill: st === 'run' ? 'rgba(111,207,151,.16)' : st === 'warn' ? 'rgba(233,162,59,.22)' : 'transparent',
      stroke: st === 'run' ? 'rgba(111,207,151,.55)' : st === 'warn' ? C.warn : C.line,
      'stroke-width': 1.5, 'stroke-dasharray': st === 'off' ? '4 3' : '', class: 'hx'
    });
    h.addEventListener('mousemove', function (e) {
      var b = stage.getBoundingClientRect();
      tip.style.display = 'block'; tip.style.left = (e.clientX - b.left + 12) + 'px'; tip.style.top = (e.clientY - b.top + 12) + 'px';
      tip.textContent = cell[0] + ' · ' + (cell[1] === 'vm' ? 'VM' : 'Jail') + ' · ' + (st === 'off' ? 'stopped' : 'running') + (cell[3] ? ' · ' + cell[3] : '');
    });
    h.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
    h.addEventListener('click', function () { show(ci); });
    g.appendChild(h);
    if (cell[1] === 'jail') { var d = el('circle', { cx: x, cy: y, r: 2.2, fill: 'rgba(230,233,238,.45)' }); d.style.pointerEvents = 'none'; g.appendChild(d); }
  });
  var ly = c.at[1] + R * 1.5 * (c.cells.length > 6 ? 2 : 1) + 50;
  var t = el('text', { x: c.at[0], y: ly, 'text-anchor': 'middle', class: 'lbl' }); t.textContent = c.name; g.appendChild(t);
  var t2 = el('text', { x: c.at[0], y: ly + 17, 'text-anchor': 'middle', class: 'lbl2' }); t2.textContent = c.role + ' · ' + c.cells.length + ' cells'; g.appendChild(t2);
  map.appendChild(g);
});

function meter(label, v) {
  return '<dt>' + label + '</dt><dd><div style="display:grid;grid-template-columns:1fr 38px;gap:8px;align-items:center"><div class="meter"><i class="' + (v > 85 ? 'warn' : '') + '" style="width:' + v + '%"></i></div><span class="num" style="text-align:right' + (v > 85 ? ';color:var(--warn)' : '') + '">' + v + '%</span></div></dd>';
}
function show(i) {
  var c = combs[i];
  var cells = c.cells.map(function (x) {
    return '<div><i class="dot ' + (x[2] === 'run' ? 'ok' : x[2] === 'warn' ? 'warn' : 'unk') + '"></i>' + x[0] + '<small>' + (x[1] === 'vm' ? 'VM' : 'Jail') + (x[2] === 'off' ? ', stopped' : '') + '</small></div>';
  }).join('');
  document.getElementById('panel').innerHTML =
    '<div><h2><i class="dot ' + c.state + '"></i>' + c.name + '</h2><div class="muted" style="font-size:12.5px;margin-top:4px">Comb · ' + c.role + ' · up ' + c.up + '</div></div>' +
    (c.note ? '<div class="note">' + c.note + '</div>' : '') +
    '<dl class="kv">' + meter('CPU', c.cpu) + meter('Memory', c.mem) + meter('ZFS pool', c.zfs) + '</dl>' +
    '<div><h3>Actions</h3><div class="acts"><a class="btn" href="#">Create cell here</a><a class="btn" href="#">Drain</a><a class="btn" href="#">Maintenance</a><a class="btn ghost" href="#">Evidence</a></div></div>' +
    '<div class="cl"><h3>Cells</h3>' + cells + '</div>' +
    '<div class="colony"><div><i class="dot ok"></i>Consensus: leader brood, term 412</div><div><i class="dot stale"></i>Replication: 11 of 12 in sync</div><div><i class="dot warn"></i>Certificate renewal due in 18 days</div></div>';
}
show(2);
</script>
</body>
</html>
